# Netlify config — Vite + React SPA
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Deploy previews for every pull request, so a reviewer can click the change.
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# Every deep link (e.g. /review/1723) must fall back to the SPA shell,
# otherwise a page refresh returns 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Response headers (CSP, HSTS, caching) live in public/_headers only — one source, so a header
# is never set twice. scripts/serve-dist-with-headers.mjs serves them locally for test:csp.
