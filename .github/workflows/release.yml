# Phase 1 of the release: verify main, bump the version, open a release PR.
#
# It deliberately does not push to `main`. Branch protection requires a pull request for
# everyone, and `github-actions[bot]` has write access but no admin bypass — a workflow that
# pushed to main directly would simply fail, and granting it a bypass would put a hole in
# the gate that protects every other change. Phase 2 (tag-release.yml) tags the version
# once the release PR is merged.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]
      dry-run:
        description: 'Verify and print the next version without opening a PR'
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run validate
      - run: npm run test:unit
      - run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    # Fake, non-secret configuration so the sign-in UI the specs assert on actually renders.
    # See the same block in ci.yml for why these are inline rather than repository secrets.
    env:
      VITE_SUPABASE_URL: https://e2e-not-a-real-project.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_e2e_not-a-real-key_000000000000
      VITE_AUTH_PROVIDERS: google,github
      VITE_SITE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- --project=chromium

  prepare:
    name: Open the release PR
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Bump the version
        id: bump
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          VERSION="v$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=release/$VERSION" >> "$GITHUB_OUTPUT"
          echo "Next version: $VERSION"

      - name: Stop here on a dry run
        if: inputs.dry-run
        run: |
          echo "Dry run — would open a PR for ${{ steps.bump.outputs.version }}"
          git --no-pager diff --stat

      - name: Push the release branch and open the PR
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add package.json package-lock.json
          git commit -m "Release $VERSION"
          git push origin "$BRANCH"

          # Body via a file: a multi-line string inline here would have to survive both
          # YAML and shell quoting, and gets unreadable fast.
          cat > /tmp/pr-body.md <<'BODY'
          Version bump opened by the Release workflow.

          `main` was verified before this branch was cut: typecheck, lint, format, exam-data
          validation, the jsdom suites, the end-to-end suite and a production build all passed.

          Merging this tags the release. `tag-release.yml` sees the new version land on `main`,
          creates the tag, publishes the GitHub release with notes generated from the merged PR
          labels, and attaches the built site. Netlify deploys the same commit, so the version in
          the app footer matches the tag.
          BODY
          sed -i 's/^          //' /tmp/pr-body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Release $VERSION" \
            --label ignore-for-release \
            --body-file /tmp/pr-body.md
