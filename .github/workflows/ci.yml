# Verification only. Runs on every pull request and on every push to main.
# It never deploys and never releases — Netlify deploys, release.yml versions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Zero warnings: a warning is how a silently-skipped file announces itself ("File
      # ignored because no matching configuration was supplied"), so it fails here.
      - run: npm run lint -- --max-warnings=0
      - run: npm run format:check
      # The guardrails ESLint cannot express, in one aggregate: the architecture and CSS-token
      # checks, the persisted storage-key invariant, the Claude Code hook tests, and the
      # production dependency audit (moderate and above fails). See package.json `guards`.
      - run: npm run guards

  audit:
    name: Dependency audit (dev, non-blocking)
    runs-on: ubuntu-latest
    # Report-only. The production tree is gated in `static` via `npm run audit:prod`; this job
    # keeps the dev-only advisories visible. The remaining ones have no usable fix: `braces` via
    # micromatch via eslint-plugin-check-file has none upstream, and `postcss-selector-parser`
    # via @tailwindcss/typography only "fixes" by downgrading typography to 0.5.4. Failing on
    # them would block every PR on something no PR can change. Make it blocking once they clear.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  deadcode:
    name: Dead code (knip)
    runs-on: ubuntu-latest
    # Blocking: knip is clean. An export kept for planned work carries a `@public` JSDoc tag
    # with its reason instead of an ignore list.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run knip:ci

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate
      # Every vitest suite, with the coverage gate on libs and hooks (thresholds in
      # vitest.config.ts — they only ratchet up).
      - run: npm run test:coverage

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # Obviously-fake Supabase configuration. Without it CI has no .env, so
    # `isSyncConfigured` in src/shared/account-sync/lib/supabaseClient.ts is false and SyncPanel
    # renders the "Cloud sync — not active" diagnostics card instead of the sign-in card
    # that e2e/auth.spec.js and e2e/signup.spec.js assert on. These values exist only to
    # satisfy that client-side validation: the specs stub every `**/auth/v1/*` request, so
    # no real network call is made and no real Supabase project is contacted. Nothing here
    # is a credential — do not replace it with one, and do not move it into a secret.
    env:
      VITE_SUPABASE_URL: https://e2e-not-a-real-project.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_e2e_not-a-real-key_000000000000
      VITE_AUTH_PROVIDERS: google,github
      # Absolute site URL, so index.html keeps its canonical / og:url / og:image tags and
      # the site-url-html plugin stops warning. Matches the dev server the specs drive.
      VITE_SITE_URL: http://localhost:5173
    # The official image ships the browsers and every OS library they need. Installing
    # them on a bare runner means `playwright install --with-deps` shelling out to apt for
    # ~20 MB of fonts and libs, which is slow and has hung the job outright.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The image's browsers only match one Playwright version. If the dependency is
      # bumped without bumping the image tag, fail here rather than in a confusing way.
      - name: Check the image matches the Playwright version
        run: |
          WANT=$(node -p "require('@playwright/test/package.json').version")
          if [ "$WANT" != "1.64.0" ]; then
            echo "::error::Playwright is $WANT but the container image is pinned to 1.64.0."
            echo "Update the image tag in .github/workflows/ci.yml and release.yml."
            exit 1
          fi
          echo "Playwright $WANT matches the image."

      - run: npm run test:e2e -- --project=chromium

      # The production build served with its real _headers: any CSP violation fails here.
      - run: npm run build
      - run: npm run test:csp
      # The same build as a PWA: one visit, then offline — every trainer, a DTZ module sat
      # and submitted, and the update prompt for a new deploy. Desktop and phone.
      - run: npm run test:offline

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Deliberately no secrets: this is what a fork or a first-time contributor gets,
      # and it catches anything that silently depends on a local .env.
      - run: npm run build
      # Entry chunk ≤ baseline + 10%, every content chunk ≤ 160 kB gzip.
      - run: npm run check:bundle
      # The CSP's script-src hashes match the inline scripts the build emitted.
      - run: npm run check:csp
